url: https://kennispunttwente.github.io/fabricQueryR/
template:
  bootstrap: 5

articles:
  - title: Authentication
    contents:
      - authentication
  - title: GraphQL
    contents:
      - graphql-schema-and-rows
  - title: Eventhouse ingestion
    contents:
      - eventhouse-ingestion
  - title: Warehouse ingestion
    contents:
      - warehouse-write
  - title: Job automation
    contents:
      - job-automation
  - title: Semantic-model refresh
    contents:
      - semantic-model-refresh
  - title: User Data Functions
    contents:
      - user-data-functions
reference:
  - title: Discovery
    desc: Find Fabric workspaces, items, and workload-specific connection details
    contents:
      - fabric_workspaces
      - fabric_items
      - fabric_item
      - fabric_lakehouses
      - fabric_warehouses
      - fabric_warehouse_snapshots
      - fabric_sql_databases
      - fabric_semantic_models
      - fabric_eventhouses
      - fabric_kql_databases
      - fabric_notebooks
      - fabric_data_pipelines
      - fabric_spark_job_definitions
      - fabric_environments
      - fabric_user_data_functions
      - fabric_graphql_apis

  - title: SQL connectivity
    desc: Connect to and query Lakehouse, Warehouse, and SQL Database endpoints
    contents:
      - fabric_sql_connection_info
      - fabric_sql_connect
      - fabric_sql_query
      - fabric_warehouse_write_table

  - title: Semantic models and DAX
    desc: Query and refresh Fabric and Power BI semantic models
    contents:
      - fabric_pbi_dax_query
      - fabric_pbi_refresh
      - print.fabric_pbi_refresh
      - print.fabric_pbi_refresh_detail

  - title: OneLake files
    desc: List, inspect, download, upload, and delete files in OneLake
    contents:
      - fabric_onelake_list
      - fabric_onelake_metadata
      - fabric_onelake_download
      - fabric_onelake_upload
      - fabric_onelake_read_file
      - fabric_onelake_write_file
      - fabric_onelake_delete

  - title: Delta tables
    desc: Discover, load, and read Delta Lake tables in OneLake
    contents:
      - fabric_lakehouse_tables
      - fabric_lakehouse_read_table
      - fabric_lakehouse_load_table
      - fabric_lakehouse_write_table
      - fabric_onelake_read_delta_table
      - fabric_delta_config

  - title: KQL
    desc: Query Eventhouse data and ingest storage, R, or Arrow sources
    contents:
      - fabric_kql_query
      - fabric_kql_ingest
      - fabric_kql_write_table
      - print.fabric_kql_ingestion
      - print.fabric_kql_ingestion_status
      - print.fabric_kql_write_result

  - title: GraphQL
    desc: Explore schemas, execute operations, and collect cursor-based pages
    contents:
      - fabric_graphql_schema
      - fabric_graphql_query
      - fabric_graphql_paginate
      - fabric_graphql_cursor
      - fabric_graphql_collect
      - print.fabric_graphql_rows

  - title: User Data Functions
    desc: Invoke published Fabric business logic through trusted public URLs
    contents:
      - fabric_function_invoke

  - title: Livy and Spark
    desc: Run Spark statements, reusable sessions, and batch jobs through Livy
    contents:
      - fabric_livy_query
      - fabric_livy_session
      - fabric_livy_batch_submit
      - FabricLivySession
      - FabricLivyStatement
      - FabricLivyBatch

  - title: Item jobs
    desc: Run, monitor, schedule, and inspect Fabric item jobs
    contents:
      - fabric_job_run
      - fabric_job_status
      - fabric_job_wait
      - fabric_job_cancel
      - fabric_job_instances
      - fabric_job_schedule_config
      - fabric_job_schedules
      - print.fabric_job
      - print.fabric_job_instance
      - print.fabric_job_schedule

  - title: Long-running operations
    desc: Resume, monitor, and retrieve Fabric Core asynchronous operations
    contents:
      - fabric_operation_status
      - fabric_operation_wait
      - fabric_operation_result

  - title: Package
    desc: Package overview
    contents:
      - fabricQueryR-package
