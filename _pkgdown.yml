url: https://kennispunttwente.github.io/fabricQueryR/
template:
  bootstrap: 5

articles:
  - title: Start here
    contents:
      - getting-started
      - authentication
  - title: Read and write data
    contents:
      - reading-data
      - ingesting-data
      - onelake-and-lakehouse
      - warehouse-write
      - eventhouse-ingestion
      - semantic-model-refresh
      - graphql-schema-and-rows
      - spark-with-livy
  - title: Run and automate workloads
    contents:
      - job-automation
      - user-data-functions

reference:
  - title: Discovery
    desc: Find Fabric workspaces, items, and workload-specific connection details
    contents:
      - fabric_workspaces
      - fabric_items
      - fabric_item
      - fabric_lakehouses
      - fabric_warehouses
      - fabric_warehouse_snapshots
      - fabric_mirrored_databases
      - fabric_sql_databases
      - fabric_semantic_models
      - fabric_eventhouses
      - fabric_kql_databases
      - fabric_notebooks
      - fabric_data_pipelines
      - fabric_spark_job_definitions
      - fabric_environments
      - fabric_user_data_functions
      - fabric_graphql_apis

  - title: SQL connectivity
    desc: Connect to and query Lakehouse, Warehouse, and SQL Database endpoints
    contents:
      - fabric_sql_tables
      - fabric_sql_views
      - fabric_sql_read_table
      - fabric_sql_query
      - fabric_sql_connect
      - fabric_sql_connection_info

  - title: Semantic models and DAX
    desc: Query and refresh Fabric and Power BI semantic models
    contents:
      - fabric_pbi_dax_query
      - fabric_pbi_refresh
      - print.fabric_pbi_refresh
      - print.fabric_pbi_refresh_detail

  - title: Livy and Spark
    desc: Run Spark statements, reusable sessions, and batch jobs through Livy
    contents:
      - fabric_livy_query
      - fabric_livy_session
      - fabric_livy_batch_submit
      - FabricLivySession
      - FabricLivyStatement
      - FabricLivyBatch

  - title: Lakehouse tables (Delta Lake tables)
    desc: Discover, load, and read Delta Lake tables in OneLake
    contents:
      - fabric_lakehouse_schemas
      - fabric_lakehouse_table
      - fabric_lakehouse_tables
      - fabric_lakehouse_read_table
      - fabric_lakehouse_load_table
      - fabric_lakehouse_write_table
      - fabric_onelake_read_delta_table
      - fabric_delta_config

  - title: OneLake files
    desc: List, inspect, download, upload, and delete files in OneLake
    contents:
      - fabric_onelake_list
      - fabric_onelake_metadata
      - fabric_onelake_read_file
      - fabric_onelake_write_file
      - fabric_onelake_download
      - fabric_onelake_upload
      - fabric_onelake_delete
      - fabric_onelake_shortcuts

  - title: Warehouse tables
    desc: Discover, load, and read Warehouse tables in Fabric
    contents:
      - fabric_warehouse_schemas
      - fabric_warehouse_table
      - fabric_warehouse_tables
      - fabric_warehouse_read_table
      - fabric_warehouse_write_table

  - title: Mirrored Database tables
    desc: Discover and read replicated Delta tables in OneLake
    contents:
      - fabric_mirrored_database_schemas
      - fabric_mirrored_database_table
      - fabric_mirrored_database_tables
      - fabric_mirrored_database_read_table

  - title: KQL (Eventhouse)
    desc: Query Eventhouse data, ingest storage or R objects, and export results
    contents:
      - fabric_kql_tables
      - fabric_kql_query
      - fabric_kql_read_table
      - fabric_kql_write_table
