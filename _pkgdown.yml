url: https://kennispunttwente.github.io/fabricQueryR/
template:
  bootstrap: 5

articles:
  - title: Authentication
    contents:
      - authentication

reference:
  - title: Discovery
    desc: Find Fabric workspaces, items, and workload-specific connection details
    contents:
      - fabric_workspaces
      - fabric_items
      - fabric_item
      - fabric_lakehouses
      - fabric_warehouses
      - fabric_warehouse_snapshots
      - fabric_sql_databases
      - fabric_semantic_models
      - fabric_eventhouses
      - fabric_kql_databases
      - fabric_notebooks
      - fabric_graphql_apis

  - title: SQL connectivity
    desc: Connect to and query Lakehouse, Warehouse, and SQL Database endpoints
    contents:
      - fabric_sql_connection_info
      - fabric_sql_connect
      - fabric_sql_query

  - title: Semantic models and DAX
    desc: Run DAX queries against Fabric and Power BI semantic models
    contents:
      - fabric_pbi_dax_query

  - title: OneLake files
    desc: List, inspect, download, upload, and delete files in OneLake
    contents:
      - fabric_onelake_list
      - fabric_onelake_metadata
      - fabric_onelake_download
      - fabric_onelake_upload
      - fabric_onelake_delete

  - title: Delta tables
    desc: Resolve and read supported Delta Lake snapshots from OneLake
    contents:
      - fabric_onelake_read_delta_table
      - fabric_delta_config

  - title: KQL
    desc: Query Eventhouse and KQL Database data
    contents:
      - fabric_kql_query

  - title: GraphQL
    desc: Execute GraphQL operations and traverse cursor-based pages
    contents:
      - fabric_graphql_query
      - fabric_graphql_paginate
      - fabric_graphql_cursor

  - title: Livy and Spark
    desc: Run Spark statements, reusable sessions, and batch jobs through Livy
    contents:
      - fabric_livy_query
      - fabric_livy_session
      - fabric_livy_batch_submit
      - FabricLivySession
      - FabricLivyStatement
      - FabricLivyBatch

  - title: Item jobs
    desc: Run, monitor, wait for, and cancel Fabric item jobs
    contents:
      - fabric_job_run
      - fabric_job_status
      - fabric_job_wait
      - fabric_job_cancel
      - print.fabric_job
      - print.fabric_job_instance

  - title: Package
    desc: Package overview
    contents:
      - fabricQueryR-package
