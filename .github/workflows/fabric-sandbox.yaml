name: Manage persistent Fabric sandbox
run-name: Fabric sandbox - ${{ inputs.sandbox }} - ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      sandbox:
        description: Interactive sandbox to use
        required: true
        type: choice
        default: development
        options: [development, shiny]
      action:
        description: Start uses paid F2 for at most one hour; status and check-shutdown never resume it
        required: true
        type: choice
        default: status
        options: [status, start, pause, check-shutdown]
      reseed:
        description: Refresh fixture data during start (normally reuse unchanged data)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Manual pause must be able to interrupt a sandbox that is still preparing.
  group: ${{ inputs.action == 'pause' && format('fabric-pause-{0}', github.repository) || inputs.action == 'status' && format('fabric-status-{0}-{1}', github.repository, github.run_id) || format('fabric-integration-{0}', github.repository) }}
  cancel-in-progress: false

jobs:
  manage:
    name: ${{ inputs.action }} ${{ inputs.sandbox }} sandbox
    runs-on: ubuntu-latest
    environment: fabric-integration
    permissions:
      contents: read
      id-token: write
      actions: write
    timeout-minutes: 80
    env:
      SANDBOX: ${{ inputs.sandbox }}
      CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID__PAID }}
      CAPACITY_RESOURCE_ID: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_F2_RESOURCE_GROUP || 'fabric-rg' }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_F2_NAME || 'rpackagecap' }}
      OWNER_ID: 9b7dcb13-8485-4429-8b4f-7f1f6ce6ebf5
      RESEED: ${{ inputs.reseed }}
      FABRIC_TEST_MANIFEST: ${{ github.workspace }}/.fabric-test-manifest.json

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock
      - name: Install locked sandbox tools
        run: uv --directory tools/fabric-sandbox sync --locked

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with: &azure_login
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check F2 status without resuming it
        if: inputs.action != 'pause'
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.capacity status \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID"

      - name: Inspect the selected workspace before starting capacity
        if: inputs.action == 'status' || inputs.action == 'start'
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.persistent_sandbox status \
            --sandbox "$SANDBOX" --capacity-id "$CAPACITY_ID" --owner-id "$OWNER_ID"

      - name: Install SQL driver before starting paid capacity
        if: inputs.action == 'start'
        run: |
          ubuntu_version="$(. /etc/os-release && echo "$VERSION_ID")"
          curl -fsSLO "https://packages.microsoft.com/config/ubuntu/${ubuntu_version}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Arm independent shutdown before resuming paid F2
        id: capacity
        if: inputs.action == 'start' || inputs.action == 'check-shutdown'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHUTDOWN_ACTION: ${{ inputs.action == 'start' && 'start' || 'check' }}
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause "$SHUTDOWN_ACTION" \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" --purpose "$SANDBOX"

      - name: Verify active session before preparing data
        id: session
        if: inputs.action == 'start'
        env:
          LEASE_ID: ${{ steps.capacity.outputs.lease_id }}
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause verify-active \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" --lease-id "$LEASE_ID"

      - name: Prepare or reuse the selected sandbox within its deadline
        if: inputs.action == 'start'
        env:
          DEADLINE: ${{ steps.session.outputs.deadline }}
        run: |
          budget=$((DEADLINE - $(date +%s) - 180))
          if (( budget <= 0 )); then
            echo "::error::The capacity session has no preparation time remaining"
            exit 1
          fi
          args=()
          if [[ "$RESEED" == "true" ]]; then args+=(--reseed); fi
          timeout --signal=TERM --kill-after=30s "${budget}s" \
            uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.persistent_sandbox prepare \
              --sandbox "$SANDBOX" --capacity-id "$CAPACITY_ID" --owner-id "$OWNER_ID" "${args[@]}"

      - name: Pause the selected sandbox session and retain its data
        if: inputs.action == 'pause'
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause pause-session \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" --purpose "$SANDBOX"
          echo 'F2 is paused. Both persistent workspaces and their data are retained.' >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in again if startup failed or was cancelled
        id: cleanup_login
        if: always() && steps.capacity.outputs.lease_id != '' && (failure() || cancelled())
        uses: azure/login@v3
        with: *azure_login

      - name: Pause the unsuccessful capacity session
        if: always() && steps.capacity.outputs.lease_id != '' && steps.cleanup_login.outcome == 'success'
        env:
          LEASE_ID: ${{ steps.capacity.outputs.lease_id }}
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause pause \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" --lease-id "$LEASE_ID"
