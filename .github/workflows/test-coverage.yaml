name: Test coverage

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Measure offline test coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(type = "tests", quiet = FALSE)
          percentage <- covr::percent_coverage(coverage)
          print(coverage)
          if (percentage < 85) {
            stop(sprintf(
              "Offline test coverage %.2f%% is below the 85%% threshold",
              percentage
            ))
          }
          saveRDS(coverage, "coverage.rds")

      - uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage.rds
