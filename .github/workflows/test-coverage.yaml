name: Test coverage

on:
  push:
    branches: [main, master]
  pull_request:

permissions: read-all

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Enforce unit-test coverage floor
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(type = "tests", quiet = FALSE)
          percent <- covr::percent_coverage(coverage)
          print(coverage)
          cat(sprintf("## Unit-test coverage: %.2f%%\n", percent),
              file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
          if (percent < 88.5) {
            stop(sprintf("Coverage %.2f%% is below the 88.5%% floor", percent))
          }
