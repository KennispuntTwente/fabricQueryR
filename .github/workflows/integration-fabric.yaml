name: Fabric integration

on:
  push:
    branches: [main, master]
    paths:
      - R/**
      - tests/testthat/helper-fabric-integration.R
      - tests/testthat/helper-delta-rs-oracle.R
      - tests/testthat/test-delta-rs-oracle.R
      - tests/testthat/test-integration-fabric-*.R
      - infra/fabric/**
      - tools/fabric-sandbox/**
      - DESCRIPTION
      - .github/workflows/integration-fabric.yaml
  pull_request:
    paths:
      - R/**
      - tests/testthat/helper-fabric-integration.R
      - tests/testthat/helper-delta-rs-oracle.R
      - tests/testthat/test-delta-rs-oracle.R
      - tests/testthat/test-integration-fabric-*.R
      - infra/fabric/**
      - tools/fabric-sandbox/**
      - DESCRIPTION
      - .github/workflows/integration-fabric.yaml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fabric-integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  provision:
    name: Provision ${{ matrix.lane }} runtime sandbox
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - lane: core
            runtime: "1.3"
          - lane: preview
            runtime: "2.0"
    env:
      TF_IN_AUTOMATION: "true"
      TF_DIR: infra/fabric/terraform
      TF_VAR_workspace_name: fabricqueryr-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      TF_VAR_capacity_id: ${{ vars.FABRIC_CAPACITY_ID }}
      FABRIC_WORKSPACE_NAME: fabricqueryr-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      FABRIC_TEST_MANIFEST: ${{ github.workspace }}/.fabric-test-manifest.json
      FABRIC_SPARK_RUNTIME_LANE: ${{ matrix.lane }}
      FABRIC_SPARK_RUNTIME_VERSION: ${{ matrix.runtime }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify tested revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mark workspace ownership and creation time
        run: |
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "TF_VAR_workspace_description=fabricqueryr-ci; repo=${GITHUB_REPOSITORY}; created=${created}; run=${run_url}" >> "$GITHUB_ENV"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir="$TF_DIR" fmt -check -recursive

      - name: Initialize Terraform
        id: terraform_init
        run: |
          terraform -chdir="$TF_DIR" init -input=false
          echo "initialized=true" >> "$GITHUB_OUTPUT"

      - name: Validate Terraform
        run: terraform -chdir="$TF_DIR" validate

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock

      - name: Install Microsoft ODBC driver
        run: |
          ubuntu_version="$(. /etc/os-release && echo "$VERSION_ID")"
          curl -fsSLO "https://packages.microsoft.com/config/ubuntu/${ubuntu_version}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install locked sandbox environment
        run: uv --directory tools/fabric-sandbox sync --locked

      - name: Test sandbox tooling
        run: uv --directory tools/fabric-sandbox run pytest

      - name: Validate local sandbox configuration
        run: uv --directory tools/fabric-sandbox run fabric-sandbox doctor

      - name: Create workspace and test targets
        run: terraform -chdir="$TF_DIR" apply -auto-approve -input=false

      - name: Export Terraform outputs
        run: |
          echo "FABRIC_WORKSPACE_ID=$(terraform -chdir="$TF_DIR" output -raw workspace_id)" >> "$GITHUB_ENV"
          echo "FABRIC_LAKEHOUSE_ID=$(terraform -chdir="$TF_DIR" output -raw lakehouse_id)" >> "$GITHUB_ENV"
          echo "FABRIC_NON_SCHEMA_LAKEHOUSE_ID=$(terraform -chdir="$TF_DIR" output -raw non_schema_lakehouse_id)" >> "$GITHUB_ENV"
          echo "FABRIC_WAREHOUSE_ID=$(terraform -chdir="$TF_DIR" output -raw warehouse_id)" >> "$GITHUB_ENV"
          echo "FABRIC_WAREHOUSE_SNAPSHOT_ID=$(terraform -chdir="$TF_DIR" output -raw warehouse_snapshot_id)" >> "$GITHUB_ENV"
          echo "FABRIC_SQL_DATABASE_ID=$(terraform -chdir="$TF_DIR" output -raw sql_database_id)" >> "$GITHUB_ENV"
          echo "FABRIC_MIRRORED_DATABASE_ID=$(terraform -chdir="$TF_DIR" output -raw mirrored_database_id)" >> "$GITHUB_ENV"
          echo "FABRIC_EVENTHOUSE_ID=$(terraform -chdir="$TF_DIR" output -raw eventhouse_id)" >> "$GITHUB_ENV"
          echo "FABRIC_KQL_DATABASE_ID=$(terraform -chdir="$TF_DIR" output -raw kql_database_id)" >> "$GITHUB_ENV"
          echo "FABRIC_GRAPHQL_API_ID=$(terraform -chdir="$TF_DIR" output -raw graphql_api_id)" >> "$GITHUB_ENV"

      - name: Deploy Fabric item definitions
        run: uv --directory tools/fabric-sandbox run fabric-sandbox deploy

      - name: Seed test data
        run: uv --directory tools/fabric-sandbox run fabric-sandbox seed

      - name: Discover Fabric endpoints
        run: uv --directory tools/fabric-sandbox run fabric-sandbox discover

      - name: Share Fabric test manifest
        uses: actions/upload-artifact@v4
        with:
          name: fabric-test-manifest-${{ matrix.lane }}
          path: .fabric-test-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Preserve Terraform state for teardown
        if: always() && steps.terraform_init.outputs.initialized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fabric-terraform-state-${{ matrix.lane }}
          path: infra/fabric/terraform/terraform.tfstate
          if-no-files-found: ignore
          retention-days: 1

  prepare_r:
    name: Prepare shared R runtime
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      r_prefix: ${{ steps.r_runtime.outputs.r_prefix }}

    steps:
      - uses: actions/checkout@v4

      - name: Record base runner packages
        run: |
          dpkg-query -W -f='${binary:Package}\n' | sort > "$RUNNER_TEMP/base-packages.txt"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configure portable R library
        id: r_runtime
        run: |
          r_home="$(R RHOME)"
          r_prefix="$(dirname "$(dirname "$r_home")")"
          case "$r_prefix" in
            /opt/R/*) ;;
            *)
              echo "::error::Unexpected R installation prefix: $r_prefix"
              exit 1
              ;;
          esac
          echo "R_LIBS_USER=$r_home/site-library" >> "$GITHUB_ENV"
          echo "R_LIBS_SITE=$r_home/site-library" >> "$GITHUB_ENV"
          echo "r_prefix=$r_prefix" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          extra-packages: >-
            any::adbcdrivermanager,
            any::adbi,
            any::arrow,
            any::DBI,
            any::odbc,
            any::purrr,
            any::testthat,
            any::vctrs,
            any::waldo,
            any::withr
          cache: always
          install-pandoc: false
          install-quarto: false

      - name: Bundle R runtime and package library
        run: |
          r_prefix="${{ steps.r_runtime.outputs.r_prefix }}"
          r_home="$r_prefix/lib/R"
          runtime_path="${r_prefix#/}"
          system_library="$r_home/system-library"
          mkdir -p "$system_library"

          dpkg-query -W -f='${binary:Package}\n' | sort > "$RUNNER_TEMP/r-packages.txt"
          comm -13 "$RUNNER_TEMP/base-packages.txt" "$RUNNER_TEMP/r-packages.txt" |
            while IFS= read -r package; do
              dpkg-query -L "$package"
            done |
            sort -u |
            while IFS= read -r library; do
              case "$library" in
                *.so|*.so.*)
                  if [[ -f "$library" ]]; then
                    cp -L "$library" "$system_library/$(basename "$library")"
                  fi
                  ;;
              esac
            done

          sudo tar --zstd -C / -cf "$RUNNER_TEMP/fabric-r-runtime.tar.zst" "$runtime_path"

      - name: Share R runtime
        uses: actions/upload-artifact@v4
        with:
          name: fabric-r-runtime
          path: ${{ runner.temp }}/fabric-r-runtime.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Test ${{ matrix.label }}
    needs:
      - provision
      - prepare_r
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: auth and discovery
            filter: integration-fabric-auth-discovery
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: user data functions
            filter: integration-fabric-functions
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: KQL and GraphQL
            filter: integration-fabric-kql-graphql
            lane: core
            runtime: "1.3"
            odbc: true
            adbc: false
          - label: OneLake and Delta
            filter: integration-fabric-onelake
            lane: preview
            runtime: "2.0"
            odbc: true
            adbc: false
          - label: SQL
            filter: integration-fabric-sql
            lane: core
            runtime: "1.3"
            odbc: true
            adbc: true
          - label: Livy
            filter: integration-fabric-livy
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: item jobs
            filter: integration-fabric-jobs
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: Power BI
            filter: integration-fabric-power-bi
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: Delta on core runtime
            filter: integration-fabric-runtime-compatibility
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
            delta: true
          - label: Livy on preview runtime
            filter: integration-fabric-runtime-compatibility
            lane: preview
            runtime: "2.0"
            odbc: false
            adbc: false
    env:
      FABRIC_TEST_MANIFEST: ${{ github.workspace }}/.fabric-test-manifest.json
      FABRIC_INTEGRATION_REQUIRED: "true"
      FABRIC_TEST_AUTH_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      FABRIC_TEST_AUTH_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      FABRIC_TEST_DENIED_WORKSPACE_ID: ${{ vars.FABRIC_TEST_DENIED_WORKSPACE_ID }}
      FABRIC_TEST_FUNCTION_SCALAR_URL: ${{ secrets.FABRIC_TEST_FUNCTION_SCALAR_URL }}
      FABRIC_TEST_FUNCTION_STRUCTURED_URL: ${{ secrets.FABRIC_TEST_FUNCTION_STRUCTURED_URL }}
      FABRIC_TEST_FUNCTION_ERROR_URL: ${{ secrets.FABRIC_TEST_FUNCTION_ERROR_URL }}
      FABRIC_SPARK_RUNTIME_LANE: ${{ matrix.lane }}
      FABRIC_SPARK_RUNTIME_VERSION: ${{ matrix.runtime }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Fabric test manifest
        uses: actions/download-artifact@v4
        with:
          name: fabric-test-manifest-${{ matrix.lane }}
          path: .

      - name: Download shared R runtime
        uses: actions/download-artifact@v4
        with:
          name: fabric-r-runtime
          path: ${{ runner.temp }}/fabric-r-runtime

      - name: Restore shared R runtime
        run: |
          r_prefix="${{ needs.prepare_r.outputs.r_prefix }}"
          r_home="$r_prefix/lib/R"
          sudo tar --zstd -C / -xf "$RUNNER_TEMP/fabric-r-runtime/fabric-r-runtime.tar.zst"
          echo "$r_prefix/bin" >> "$GITHUB_PATH"
          echo "R_HOME=$r_home" >> "$GITHUB_ENV"
          echo "R_LIBS_USER=$r_home/site-library" >> "$GITHUB_ENV"
          echo "R_LIBS_SITE=$r_home/site-library" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$r_home/system-library${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          export LD_LIBRARY_PATH="$r_home/system-library${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          missing_libraries="$(find "$r_home/site-library" -type f -name '*.so' -exec ldd {} \; | grep 'not found' || true)"
          if [[ -n "$missing_libraries" ]]; then
            echo "::error::The shared R runtime has unresolved system libraries"
            echo "$missing_libraries"
            exit 1
          fi
          "$r_prefix/bin/Rscript" -e 'stopifnot(requireNamespace("testthat", quietly = TRUE))'

      - name: Install Microsoft ODBC driver
        if: matrix.odbc
        run: |
          ubuntu_version="$(. /etc/os-release && echo "$VERSION_ID")"
          curl -fsSLO "https://packages.microsoft.com/config/ubuntu/${ubuntu_version}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Set up uv
        if: matrix.adbc || matrix.filter == 'integration-fabric-onelake' || matrix.delta
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock

      - name: Install Microsoft SQL Server ADBC driver
        if: matrix.adbc
        run: uvx dbc==0.3.0 install "mssql>=1.5,<2"

      - name: Install locked delta-rs runtime environment
        if: matrix.filter == 'integration-fabric-onelake' || matrix.delta
        run: uv --directory tools/fabric-sandbox sync --locked

      - name: Select the locked delta-rs Python environment
        if: matrix.filter == 'integration-fabric-onelake' || matrix.delta
        run: echo "RETICULATE_PYTHON=$GITHUB_WORKSPACE/tools/fabric-sandbox/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Acquire short-lived test tokens
        run: |
          storage_token="$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)"
          sql_token="$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)"
          api_token="$(az account get-access-token --resource https://api.fabric.microsoft.com/ --query accessToken -o tsv)"
          pbi_token="$(az account get-access-token --resource https://analysis.windows.net/powerbi/api --query accessToken -o tsv)"
          kusto_token="$(az account get-access-token --resource https://api.kusto.windows.net --query accessToken -o tsv)"
          echo "::add-mask::$storage_token"
          echo "::add-mask::$sql_token"
          echo "::add-mask::$api_token"
          echo "::add-mask::$pbi_token"
          echo "::add-mask::$kusto_token"
          {
            echo "FABRIC_TEST_STORAGE_TOKEN=$storage_token"
            echo "FABRIC_TEST_SQL_TOKEN=$sql_token"
            echo "FABRIC_TEST_API_TOKEN=$api_token"
            echo "FABRIC_TEST_PBI_TOKEN=$pbi_token"
            echo "FABRIC_TEST_KUSTO_TOKEN=$kusto_token"
          } >> "$GITHUB_ENV"

      - name: Acquire least-privilege Fabric token
        if: matrix.filter == 'integration-fabric-auth-discovery'
        env:
          LIMITED_CLIENT_ID: ${{ vars.FABRIC_TEST_LIMITED_CLIENT_ID }}
          LIMITED_CLIENT_SECRET: ${{ secrets.FABRIC_TEST_LIMITED_CLIENT_SECRET }}
          LIMITED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [[ -z "$LIMITED_CLIENT_ID" || -z "$LIMITED_CLIENT_SECRET" ]]; then
            echo "::notice::Least-privilege coverage is opt-in; configure FABRIC_TEST_LIMITED_CLIENT_ID and FABRIC_TEST_LIMITED_CLIENT_SECRET to enable it"
            exit 0
          fi
          response="$(curl -fsS -X POST \
            "https://login.microsoftonline.com/${LIMITED_TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "client_id=${LIMITED_CLIENT_ID}" \
            --data-urlencode "client_secret=${LIMITED_CLIENT_SECRET}" \
            --data-urlencode "scope=https://api.fabric.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")"
          limited_token="$(jq -er '.access_token' <<< "$response")"
          echo "::add-mask::$limited_token"
          echo "FABRIC_TEST_LIMITED_API_TOKEN=$limited_token" >> "$GITHUB_ENV"

      - name: Run Fabric integration tests
        env:
          FABRIC_TEST_AUTH_CLIENT_SECRET: ${{ secrets.FABRIC_TEST_AUTH_CLIENT_SECRET }}
          FABRIC_TEST_FILTER: ${{ matrix.filter }}
        run: Rscript -e 'testthat::test_local(filter = Sys.getenv("FABRIC_TEST_FILTER"), stop_on_failure = TRUE)'

  teardown:
    name: Destroy ${{ matrix.lane }} runtime sandbox
    needs:
      - provision
      - integration
    if: always() && needs.provision.result != 'skipped'
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [core, preview]
    env:
      TF_IN_AUTOMATION: "true"
      TF_DIR: infra/fabric/terraform
      TF_VAR_workspace_name: fabricqueryr-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      TF_VAR_capacity_id: ${{ vars.FABRIC_CAPACITY_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Restore Terraform state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fabric-terraform-state-${{ matrix.lane }}
          path: infra/fabric/terraform

      - name: Initialize Terraform
        if: hashFiles('infra/fabric/terraform/terraform.tfstate') != ''
        run: terraform -chdir="$TF_DIR" init -input=false

      - name: Destroy Fabric sandbox
        if: hashFiles('infra/fabric/terraform/terraform.tfstate') != ''
        run: terraform -chdir="$TF_DIR" destroy -auto-approve -input=false
