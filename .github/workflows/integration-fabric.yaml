name: Fabric integration

on:
  push:
    branches: [main, master]
    paths: &paths
      - R/**
      - tests/testthat/helper-*.R
      - tests/fixtures/**
      - tests/testthat/test-delta-rs-oracle.R
      - tests/testthat/test-integration-fabric-*.R
      - infra/fabric/**
      - tools/fabric-sandbox/**
      - tools/ci/**
      - DESCRIPTION
      - .github/workflows/integration-fabric.yaml
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      action:
        description: "test resumes paid F2 for at most one hour; check-shutdown never resumes it"
        type: choice
        options: [test, check-shutdown]
        default: test
      lane:
        description: "Persistent runtime workspaces to test"
        type: choice
        options: [all, core, preview]
        default: all
      reseed:
        description: "Force fixture data to be seeded again (normally stale inputs are detected)"
        type: boolean
        default: false
      sql_database:
        description: "Include the optional Fabric SQL Database target"
        type: boolean
        default: true
      required_features:
        description: "Comma-separated required feature lanes (see tests/fixtures/feature-lanes.md)"
        type: string
        default: ""

permissions:
  contents: read

env:
  NOT_CRAN: "true"

# Shared with manual sandbox setup. Shutdown jobs use independent groups.
concurrency:
  group: fabric-integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tooling:
    name: Check sandbox tooling without starting Fabric
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock
      - run: uv --directory tools/fabric-sandbox sync --locked
      - run: uv --directory tools/fabric-sandbox run pytest
      - run: python3 -m unittest discover -s tools/ci/tests -v

  activate:
    name: Arm shutdown and start a bounded integration session
    needs: [tooling, prepare_r]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      needs.tooling.result == 'success' &&
      (needs.prepare_r.result == 'success' || inputs.action == 'check-shutdown')
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      id-token: write
    outputs:
      lease_id: ${{ steps.capacity.outputs.lease_id }}
    env:
      CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID__PAID }}
      CAPACITY_RESOURCE_ID: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_F2_RESOURCE_GROUP || 'fabric-rg' }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_F2_NAME || 'rpackagecap' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock
      - run: uv --directory tools/fabric-sandbox sync --locked
      - uses: azure/login@v3
        with: &azure_login
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Arm independent shutdown before resuming paid F2
        id: capacity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHUTDOWN_ACTION: ${{ inputs.action == 'test' && 'start' || 'check' }}
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause "$SHUTDOWN_ACTION" \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" \
            --purpose integration --run "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Pause immediately if activation failed or was cancelled
        if: always() && steps.capacity.outputs.lease_id != '' && steps.capacity.outcome != 'success'
        env:
          LEASE_ID: ${{ steps.capacity.outputs.lease_id }}
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause pause \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" --lease-id "$LEASE_ID"

  provision_core:
    name: Prepare persistent ${{ matrix.lane }} fixtures
    needs: activate
    if: inputs.action == 'test' && inputs.lane != 'preview'
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 45
    permissions: &fabric_permissions
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - lane: core
            runtime: "1.3"
    env: &provision_env
      FABRIC_CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID__PAID }}
      FABRIC_TEST_MANIFEST: ${{ github.workspace }}/.fabric-test-manifest.json
      FABRIC_SPARK_RUNTIME_LANE: ${{ matrix.lane }}
      FABRIC_SPARK_RUNTIME_VERSION: ${{ matrix.runtime }}
      TF_VAR_provision_sql_database: ${{ inputs.sql_database && 'true' || 'false' }}
      LEASE_ID: ${{ needs.activate.outputs.lease_id }}
      CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID__PAID }}
      CAPACITY_RESOURCE_ID: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_F2_RESOURCE_GROUP || 'fabric-rg' }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_F2_NAME || 'rpackagecap' }}
    steps: &provision_steps
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock
      - run: uv --directory tools/fabric-sandbox sync --locked
      - name: Install Microsoft ODBC driver
        run: |
          ubuntu_version="$(. /etc/os-release && echo "$VERSION_ID")"
          curl -fsSLO "https://packages.microsoft.com/config/ubuntu/${ubuntu_version}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - uses: azure/login@v3
        with: *azure_login
      - name: Verify active session before touching persistent fixtures
        id: active
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause verify-active \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" --lease-id "$LEASE_ID"
      - name: Reset scratch resources and prepare only stale fixtures
        env:
          RESEED: ${{ inputs.reseed }}
          DEADLINE: ${{ steps.active.outputs.deadline }}
        run: |
          args=()
          if [[ "$RESEED" == "true" ]]; then args+=(--reseed); fi
          remaining=$((DEADLINE - $(date +%s) - 180))
          test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=20s "${remaining}s" \
            uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.persistent_ci prepare "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-test-manifest-${{ matrix.lane }}
          path: .fabric-test-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  provision_preview:
    name: Prepare persistent ${{ matrix.lane }} fixtures
    needs: activate
    if: inputs.action == 'test' && inputs.lane != 'core'
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 45
    permissions: *fabric_permissions
    strategy:
      matrix:
        include:
          - lane: preview
            runtime: "2.0"
    env: *provision_env
    steps: *provision_steps

  prepare_r:
    name: Prepare shared R runtime
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      r_prefix: ${{ steps.r_runtime.outputs.r_prefix }}

    steps:
      - uses: actions/checkout@v4

      - name: Record base runner packages
        run: |
          dpkg-query -W -f='${binary:Package}\n' | sort > "$RUNNER_TEMP/base-packages.txt"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configure portable R library
        id: r_runtime
        run: |
          r_home="$(R RHOME)"
          r_prefix="$(dirname "$(dirname "$r_home")")"
          case "$r_prefix" in
            /opt/R/*) ;;
            *)
              echo "::error::Unexpected R installation prefix: $r_prefix"
              exit 1
              ;;
          esac
          echo "R_LIBS_USER=$r_home/site-library" >> "$GITHUB_ENV"
          echo "R_LIBS_SITE=$r_home/site-library" >> "$GITHUB_ENV"
          echo "r_prefix=$r_prefix" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          # Config/Needs/ci supplies tested releases of archived ADBC packages.
          needs: ci
          extra-packages: >-
            any::adbcdrivermanager,
            any::adbi,
            any::arrow,
            any::DBI,
            any::dplyr,
            any::odbc,
            any::purrr,
            any::testthat,
            any::vctrs,
            any::waldo,
            any::withr
          cache: always
          install-pandoc: false
          install-quarto: false

      - name: Bundle R runtime and package library
        run: |
          r_prefix="${{ steps.r_runtime.outputs.r_prefix }}"
          r_home="$r_prefix/lib/R"
          runtime_path="${r_prefix#/}"
          system_library="$r_home/system-library"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$system_library"

          dpkg-query -W -f='${binary:Package}\n' | sort > "$RUNNER_TEMP/r-packages.txt"
          comm -13 "$RUNNER_TEMP/base-packages.txt" "$RUNNER_TEMP/r-packages.txt" |
            while IFS= read -r package; do
              dpkg-query -L "$package"
            done |
            sort -u |
            while IFS= read -r library; do
              case "$library" in
                *.so|*.so.*)
                  if [[ -f "$library" ]]; then
                    cp -L "$library" "$system_library/$(basename "$library")"
                  fi
                  ;;
              esac
            done

          archive="$RUNNER_TEMP/fabric-r-runtime.tar.zst"
          sudo tar --zstd -C / -cf "$archive" "$runtime_path"
          test -s "$archive"
          sudo tar --zstd -tf "$archive" | grep -Fx "$runtime_path/bin/R"
          sudo tar --zstd -tf "$archive" |
            grep -Fx "$runtime_path/lib/R/site-library/testthat/DESCRIPTION"

      - name: Share R runtime
        uses: actions/upload-artifact@v4
        with:
          name: fabric-r-runtime
          path: ${{ runner.temp }}/fabric-r-runtime.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  integration_core:
    name: Test ${{ matrix.label }}
    needs:
      - provision_core
      - prepare_r
      - activate
    runs-on: ubuntu-latest
    environment: fabric-integration
    permissions: *fabric_permissions
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: auth and discovery
            filter: integration-fabric-auth-discovery
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: user data functions
            filter: integration-fabric-functions
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: KQL and GraphQL
            filter: integration-fabric-kql-graphql
            lane: core
            runtime: "1.3"
            odbc: true
            adbc: false
          - label: SQL
            filter: integration-fabric-sql
            lane: core
            runtime: "1.3"
            odbc: true
            adbc: true
          - label: Livy
            filter: integration-fabric-livy
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: item jobs
            filter: integration-fabric-jobs
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: Power BI
            filter: integration-fabric-power-bi
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
          - label: Delta on core runtime
            filter: integration-fabric-runtime-compatibility
            lane: core
            runtime: "1.3"
            odbc: false
            adbc: false
            delta: true
    env: &integration_env
      FABRIC_TEST_MANIFEST: ${{ github.workspace }}/.fabric-test-manifest.json
      FABRIC_INTEGRATION_REQUIRED: "true"
      FABRIC_TEST_REQUIRED_FEATURES: ${{ inputs.required_features || vars.FABRIC_TEST_REQUIRED_FEATURES }}
      FABRIC_TEST_GRAPHQL_INTROSPECTION_ENDPOINT: ${{ vars.FABRIC_TEST_GRAPHQL_INTROSPECTION_ENDPOINT }}
      FABRIC_TEST_GRAPHQL_INTROSPECTION_ROOT: ${{ vars.FABRIC_TEST_GRAPHQL_INTROSPECTION_ROOT }}
      FABRIC_TEST_GRAPHQL_DISABLED_ENDPOINT: ${{ vars.FABRIC_TEST_GRAPHQL_DISABLED_ENDPOINT }}
      FABRIC_TEST_EXTERNAL_SHORTCUT_MATRIX_JSON: ${{ secrets.FABRIC_TEST_EXTERNAL_SHORTCUT_MATRIX_JSON }}
      FABRIC_TEST_CROSS_WORKSPACE_ID: ${{ vars.FABRIC_TEST_CROSS_WORKSPACE_ID }}
      FABRIC_TEST_CROSS_LAKEHOUSE_ID: ${{ vars.FABRIC_TEST_CROSS_LAKEHOUSE_ID }}
      FABRIC_TEST_NOTEBOOK_COMPUTE_JSON: ${{ vars.FABRIC_TEST_NOTEBOOK_COMPUTE_JSON }}
      FABRIC_TEST_SQL_NOTEBOOK_ID: ${{ vars.FABRIC_TEST_SQL_NOTEBOOK_ID }}
      FABRIC_TEST_SQL_NOTEBOOK_WAREHOUSE_ID: ${{ vars.FABRIC_TEST_SQL_NOTEBOOK_WAREHOUSE_ID }}
      FABRIC_TEST_WORKLOAD_SCHEDULES_JSON: ${{ vars.FABRIC_TEST_WORKLOAD_SCHEDULES_JSON }}
      FABRIC_TEST_KQL_CANCELED_INGESTION_ID: ${{ vars.FABRIC_TEST_KQL_CANCELED_INGESTION_ID }}
      FABRIC_TEST_KQL_CANCELED_TABLE: ${{ vars.FABRIC_TEST_KQL_CANCELED_TABLE }}
      FABRIC_TEST_REFRESHABLE_AUTH: "true"
      FABRIC_TEST_AUTH_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      FABRIC_TEST_AUTH_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      FABRIC_TEST_DENIED_WORKSPACE_ID: ${{ vars.FABRIC_TEST_DENIED_WORKSPACE_ID }}
      FABRIC_TEST_FUNCTION_SCALAR_URL: ${{ secrets.FABRIC_TEST_FUNCTION_SCALAR_URL }}
      FABRIC_TEST_FUNCTION_STRUCTURED_URL: ${{ secrets.FABRIC_TEST_FUNCTION_STRUCTURED_URL }}
      FABRIC_TEST_FUNCTION_ERROR_URL: ${{ secrets.FABRIC_TEST_FUNCTION_ERROR_URL }}
      FABRIC_TEST_EXTERNAL_SHORTCUT_JSON: ${{ secrets.FABRIC_TEST_EXTERNAL_SHORTCUT_JSON }}
      FABRIC_TEST_SHORTCUT_TRANSFORMS: ${{ vars.FABRIC_TEST_SHORTCUT_TRANSFORMS }}
      FABRIC_SPARK_RUNTIME_LANE: ${{ matrix.lane }}
      FABRIC_SPARK_RUNTIME_VERSION: ${{ matrix.runtime }}

    steps: &integration_steps
      - uses: actions/checkout@v4

      - name: Download Fabric test manifest
        uses: actions/download-artifact@v4
        with:
          name: fabric-test-manifest-${{ matrix.lane }}
          path: .

      - name: Download shared R runtime
        uses: actions/download-artifact@v4
        with:
          name: fabric-r-runtime
          path: ${{ runner.temp }}/fabric-r-runtime

      - name: Restore shared R runtime
        run: |
          r_prefix="${{ needs.prepare_r.outputs.r_prefix }}"
          r_home="$r_prefix/lib/R"
          sudo tar --zstd -C / -xf "$RUNNER_TEMP/fabric-r-runtime/fabric-r-runtime.tar.zst"
          echo "$r_prefix/bin" >> "$GITHUB_PATH"
          echo "R_HOME=$r_home" >> "$GITHUB_ENV"
          echo "R_LIBS_USER=$r_home/site-library" >> "$GITHUB_ENV"
          echo "R_LIBS_SITE=$r_home/site-library" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$r_home/system-library${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          export LD_LIBRARY_PATH="$r_home/system-library${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          missing_libraries="$(find "$r_home/site-library" -type f -name '*.so' -exec ldd {} \; | grep 'not found' || true)"
          if [[ -n "$missing_libraries" ]]; then
            echo "::error::The shared R runtime has unresolved system libraries"
            echo "$missing_libraries"
            exit 1
          fi
          "$r_prefix/bin/Rscript" -e 'stopifnot(requireNamespace("testthat", quietly = TRUE))'

      - name: Install Microsoft ODBC driver
        if: matrix.odbc
        run: |
          ubuntu_version="$(. /etc/os-release && echo "$VERSION_ID")"
          curl -fsSLO "https://packages.microsoft.com/config/ubuntu/${ubuntu_version}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock

      - name: Install Microsoft SQL Server ADBC driver
        if: matrix.adbc
        run: uvx dbc==0.3.0 install "mssql>=1.5,<2"

      - name: Install locked delta-rs runtime environment
        run: uv --directory tools/fabric-sandbox sync --locked

      - name: Select the locked delta-rs Python environment
        if: matrix.filter == 'integration-fabric-onelake' || matrix.delta
        run: echo "RETICULATE_PYTHON=$GITHUB_WORKSPACE/tools/fabric-sandbox/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Acquire least-privilege Fabric token
        if: matrix.filter == 'integration-fabric-auth-discovery'
        env:
          LIMITED_CLIENT_ID: ${{ vars.FABRIC_TEST_LIMITED_CLIENT_ID }}
          LIMITED_CLIENT_SECRET: ${{ secrets.FABRIC_TEST_LIMITED_CLIENT_SECRET }}
          LIMITED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [[ -z "$LIMITED_CLIENT_ID" || -z "$LIMITED_CLIENT_SECRET" ]]; then
            echo "::notice::Least-privilege coverage is opt-in; configure FABRIC_TEST_LIMITED_CLIENT_ID and FABRIC_TEST_LIMITED_CLIENT_SECRET to enable it"
            exit 0
          fi
          response="$(curl -fsS -X POST \
            "https://login.microsoftonline.com/${LIMITED_TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "client_id=${LIMITED_CLIENT_ID}" \
            --data-urlencode "client_secret=${LIMITED_CLIENT_SECRET}" \
            --data-urlencode "scope=https://api.fabric.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")"
          limited_token="$(jq -er '.access_token' <<< "$response")"
          echo "::add-mask::$limited_token"
          echo "FABRIC_TEST_LIMITED_API_TOKEN=$limited_token" >> "$GITHUB_ENV"

      - name: Verify this run still owns an active capacity session
        id: active
        env:
          LEASE_ID: ${{ needs.activate.outputs.lease_id }}
          CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID__PAID }}
          CAPACITY_RESOURCE_ID: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_F2_RESOURCE_GROUP || 'fabric-rg' }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_F2_NAME || 'rpackagecap' }}
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause verify-active \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" --lease-id "$LEASE_ID"

      - name: Run Fabric integration tests
        env:
          FABRIC_TEST_AUTH_CLIENT_SECRET: ${{ secrets.FABRIC_TEST_AUTH_CLIENT_SECRET }}
          FABRIC_TEST_FILTER: ${{ matrix.filter }}
          DEADLINE: ${{ steps.active.outputs.deadline }}
        run: |
          remaining=$((DEADLINE - $(date +%s) - 180))
          test "$remaining" -gt 0
          timeout --signal=INT --kill-after=20s "${remaining}s" \
            Rscript -e 'source("tools/fabric-sandbox/ci-integration.R"); run_fabric_ci_integration()'

  integration_preview:
    name: Test ${{ matrix.label }}
    needs:
      - provision_preview
      - prepare_r
      - activate
    runs-on: ubuntu-latest
    environment: fabric-integration
    permissions: *fabric_permissions
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: OneLake and Delta
            filter: integration-fabric-onelake
            lane: preview
            runtime: "2.0"
            odbc: true
            adbc: false
            delta: false
          - label: Livy on preview runtime
            filter: integration-fabric-runtime-compatibility
            lane: preview
            runtime: "2.0"
            odbc: false
            adbc: false
            delta: false
    env: *integration_env
    steps: *integration_steps

  pause:
    name: Pause F2 and retain integration fixtures
    needs: [activate, provision_core, provision_preview, integration_core, integration_preview]
    if: always() && needs.activate.outputs.lease_id != ''
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 10
    permissions: *fabric_permissions
    env:
      CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID__PAID }}
      CAPACITY_RESOURCE_ID: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_F2_RESOURCE_GROUP || 'fabric-rg' }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_F2_NAME || 'rpackagecap' }}
      FABRIC_CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID__PAID }}
      LEASE_ID: ${{ needs.activate.outputs.lease_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock
      - run: uv --directory tools/fabric-sandbox sync --locked
      - name: Sign in for cleanup
        uses: azure/login@v3
        with: *azure_login
      - name: Stop test schedules and compute before pausing
        if: inputs.action == 'test'
        timeout-minutes: 2
        env:
          TEST_LANE: ${{ inputs.lane }}
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause verify-active \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" --lease-id "$LEASE_ID"
          status=0
          if [[ "$TEST_LANE" != "preview" ]]; then
            FABRIC_SPARK_RUNTIME_LANE=core FABRIC_SPARK_RUNTIME_VERSION=1.3 \
              uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.persistent_ci clean || status=1
          fi
          if [[ "$TEST_LANE" != "core" ]]; then
            FABRIC_SPARK_RUNTIME_LANE=preview FABRIC_SPARK_RUNTIME_VERSION=2.0 \
              uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.persistent_ci clean || status=1
          fi
          exit "$status"
      - name: Sign in again for pause even if cleanup failed
        if: always()
        uses: azure/login@v3
        with: *azure_login
      - name: Pause only this integration session
        if: always()
        run: |
          uv --directory tools/fabric-sandbox run python -m fabricqueryr_sandbox.autopause pause \
            --resource-id "$CAPACITY_RESOURCE_ID" --capacity-id "$CAPACITY_ID" --lease-id "$LEASE_ID"
          echo 'F2 paused; persistent workspaces, fixtures and Delta history retained.' >> "$GITHUB_STEP_SUMMARY"
