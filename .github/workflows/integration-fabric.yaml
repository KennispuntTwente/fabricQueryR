name: Fabric integration

on:
  push:
    branches: [main, master]
    paths:
      - R/**
      - tests/testthat/helper-fabric-integration.R
      - tests/testthat/helper-delta-rs-oracle.R
      - tests/testthat/test-delta-rs-oracle.R
      - tests/testthat/test-integration-fabric-*.R
      - infra/fabric/**
      - tools/fabric-sandbox/**
      - DESCRIPTION
      - .github/workflows/integration-fabric.yaml
  pull_request:
    paths:
      - R/**
      - tests/testthat/helper-fabric-integration.R
      - tests/testthat/helper-delta-rs-oracle.R
      - tests/testthat/test-delta-rs-oracle.R
      - tests/testthat/test-integration-fabric-*.R
      - infra/fabric/**
      - tools/fabric-sandbox/**
      - DESCRIPTION
      - .github/workflows/integration-fabric.yaml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fabric-integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  provision:
    name: Provision Fabric sandbox
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 110
    outputs:
      terraform-initialized: ${{ steps.terraform_init.outputs.initialized }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_DIR: infra/fabric/terraform
      TF_VAR_workspace_name: fabricqueryr-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TF_VAR_capacity_id: ${{ vars.FABRIC_CAPACITY_ID }}
      FABRIC_WORKSPACE_NAME: fabricqueryr-ci-${{ github.run_id }}-${{ github.run_attempt }}
      FABRIC_TEST_MANIFEST: ${{ github.workspace }}/.fabric-test-manifest.json

    steps:
      - uses: actions/checkout@v4

      - name: Verify tested revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mark workspace ownership and creation time
        run: |
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "TF_VAR_workspace_description=fabricqueryr-ci; repo=${GITHUB_REPOSITORY}; created=${created}; run=${run_url}" >> "$GITHUB_ENV"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Acquire sandbox access tokens
        run: |
          storage_token="$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)"
          sql_token="$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)"
          api_token="$(az account get-access-token --resource https://api.fabric.microsoft.com/ --query accessToken -o tsv)"
          pbi_token="$(az account get-access-token --resource https://analysis.windows.net/powerbi/api --query accessToken -o tsv)"
          kusto_token="$(az account get-access-token --resource https://api.kusto.windows.net --query accessToken -o tsv)"
          echo "::add-mask::$storage_token"
          echo "::add-mask::$sql_token"
          echo "::add-mask::$api_token"
          echo "::add-mask::$pbi_token"
          echo "::add-mask::$kusto_token"
          {
            echo "FABRIC_SANDBOX_USE_ENV_TOKENS=true"
            echo "FABRIC_TEST_STORAGE_TOKEN=$storage_token"
            echo "FABRIC_TEST_SQL_TOKEN=$sql_token"
            echo "FABRIC_TEST_API_TOKEN=$api_token"
            echo "FABRIC_TEST_PBI_TOKEN=$pbi_token"
            echo "FABRIC_TEST_KUSTO_TOKEN=$kusto_token"
          } >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir="$TF_DIR" fmt -check -recursive

      - name: Initialize Terraform
        id: terraform_init
        run: |
          terraform -chdir="$TF_DIR" init -input=false
          echo "initialized=true" >> "$GITHUB_OUTPUT"

      - name: Validate Terraform
        run: terraform -chdir="$TF_DIR" validate

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock

      - name: Install Microsoft ODBC driver
        run: |
          ubuntu_version="$(. /etc/os-release && echo "$VERSION_ID")"
          curl -fsSLO "https://packages.microsoft.com/config/ubuntu/${ubuntu_version}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install locked sandbox environment
        run: uv --directory tools/fabric-sandbox sync --locked

      - name: Test sandbox tooling
        run: uv --directory tools/fabric-sandbox run pytest

      - name: Validate local sandbox configuration
        run: uv --directory tools/fabric-sandbox run fabric-sandbox doctor

      - name: Create workspace and test targets
        run: terraform -chdir="$TF_DIR" apply -auto-approve -input=false

      - name: Export Terraform outputs
        run: |
          echo "FABRIC_WORKSPACE_ID=$(terraform -chdir="$TF_DIR" output -raw workspace_id)" >> "$GITHUB_ENV"
          echo "FABRIC_LAKEHOUSE_ID=$(terraform -chdir="$TF_DIR" output -raw lakehouse_id)" >> "$GITHUB_ENV"
          echo "FABRIC_NON_SCHEMA_LAKEHOUSE_ID=$(terraform -chdir="$TF_DIR" output -raw non_schema_lakehouse_id)" >> "$GITHUB_ENV"
          echo "FABRIC_WAREHOUSE_ID=$(terraform -chdir="$TF_DIR" output -raw warehouse_id)" >> "$GITHUB_ENV"
          echo "FABRIC_SQL_DATABASE_ID=$(terraform -chdir="$TF_DIR" output -raw sql_database_id)" >> "$GITHUB_ENV"
          echo "FABRIC_EVENTHOUSE_ID=$(terraform -chdir="$TF_DIR" output -raw eventhouse_id)" >> "$GITHUB_ENV"
          echo "FABRIC_KQL_DATABASE_ID=$(terraform -chdir="$TF_DIR" output -raw kql_database_id)" >> "$GITHUB_ENV"
          echo "FABRIC_GRAPHQL_API_ID=$(terraform -chdir="$TF_DIR" output -raw graphql_api_id)" >> "$GITHUB_ENV"

      - name: Deploy Fabric item definitions
        run: uv --directory tools/fabric-sandbox run fabric-sandbox deploy

      - name: Seed test data
        run: uv --directory tools/fabric-sandbox run fabric-sandbox seed

      - name: Discover Fabric endpoints
        run: uv --directory tools/fabric-sandbox run fabric-sandbox discover

      - name: Share Fabric test manifest
        uses: actions/upload-artifact@v4
        with:
          name: fabric-test-manifest
          path: .fabric-test-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Preserve Terraform state for teardown
        if: always() && steps.terraform_init.outputs.initialized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fabric-terraform-state
          path: infra/fabric/terraform/terraform.tfstate
          if-no-files-found: ignore
          retention-days: 1

  integration:
    name: Test ${{ matrix.label }}
    needs: provision
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: auth and discovery
            filter: integration-fabric-auth-discovery
            odbc: false
            adbc: false
          - label: KQL and GraphQL
            filter: integration-fabric-kql-graphql
            odbc: true
            adbc: false
          - label: OneLake and Delta
            filter: integration-fabric-onelake
            odbc: false
            adbc: false
          - label: SQL
            filter: integration-fabric-sql
            odbc: true
            adbc: true
          - label: Livy
            filter: integration-fabric-livy
            odbc: false
            adbc: false
          - label: item jobs
            filter: integration-fabric-jobs
            odbc: false
            adbc: false
          - label: Power BI
            filter: integration-fabric-power-bi
            odbc: false
            adbc: false
    env:
      FABRIC_TEST_MANIFEST: ${{ github.workspace }}/.fabric-test-manifest.json
      FABRIC_INTEGRATION_REQUIRED: "true"
      FABRIC_TEST_AUTH_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      FABRIC_TEST_AUTH_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Fabric test manifest
        uses: actions/download-artifact@v4
        with:
          name: fabric-test-manifest
          path: .

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Acquire short-lived test tokens
        run: |
          storage_token="$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)"
          sql_token="$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)"
          api_token="$(az account get-access-token --resource https://api.fabric.microsoft.com/ --query accessToken -o tsv)"
          pbi_token="$(az account get-access-token --resource https://analysis.windows.net/powerbi/api --query accessToken -o tsv)"
          kusto_token="$(az account get-access-token --resource https://api.kusto.windows.net --query accessToken -o tsv)"
          echo "::add-mask::$storage_token"
          echo "::add-mask::$sql_token"
          echo "::add-mask::$api_token"
          echo "::add-mask::$pbi_token"
          echo "::add-mask::$kusto_token"
          {
            echo "FABRIC_TEST_STORAGE_TOKEN=$storage_token"
            echo "FABRIC_TEST_SQL_TOKEN=$sql_token"
            echo "FABRIC_TEST_API_TOKEN=$api_token"
            echo "FABRIC_TEST_PBI_TOKEN=$pbi_token"
            echo "FABRIC_TEST_KUSTO_TOKEN=$kusto_token"
          } >> "$GITHUB_ENV"

      - name: Install Microsoft ODBC driver
        if: matrix.odbc
        run: |
          ubuntu_version="$(. /etc/os-release && echo "$VERSION_ID")"
          curl -fsSLO "https://packages.microsoft.com/config/ubuntu/${ubuntu_version}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Set up uv
        if: matrix.adbc || matrix.filter == 'integration-fabric-onelake'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock

      - name: Install Microsoft SQL Server ADBC driver
        if: matrix.adbc
        run: uvx dbc==0.3.0 install "mssql>=1.5,<2"

      - name: Install locked delta-rs runtime environment
        if: matrix.filter == 'integration-fabric-onelake'
        run: uv --directory tools/fabric-sandbox sync --locked

      - name: Select the locked delta-rs Python environment
        if: matrix.filter == 'integration-fabric-onelake'
        run: echo "RETICULATE_PYTHON=$GITHUB_WORKSPACE/tools/fabric-sandbox/.venv/bin/python" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Run Fabric integration tests
        env:
          FABRIC_TEST_AUTH_CLIENT_SECRET: ${{ secrets.FABRIC_TEST_AUTH_CLIENT_SECRET }}
          FABRIC_TEST_FILTER: ${{ matrix.filter }}
        run: Rscript -e 'devtools::test(filter = Sys.getenv("FABRIC_TEST_FILTER"), stop_on_failure = TRUE)'

  teardown:
    name: Destroy Fabric sandbox
    needs:
      - provision
      - integration
    if: always() && needs.provision.outputs.terraform-initialized == 'true'
    runs-on: ubuntu-latest
    environment: fabric-integration
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      TF_DIR: infra/fabric/terraform
      TF_VAR_workspace_name: fabricqueryr-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TF_VAR_capacity_id: ${{ vars.FABRIC_CAPACITY_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Restore Terraform state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fabric-terraform-state
          path: infra/fabric/terraform

      - name: Initialize Terraform
        run: terraform -chdir="$TF_DIR" init -input=false

      - name: Destroy Fabric sandbox
        run: terraform -chdir="$TF_DIR" destroy -auto-approve -input=false
