# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

env:
  NOT_CRAN: "true"

jobs:
  minimum-arrow:
    runs-on: windows-latest
    name: Parquet staging (Arrow 9.0.0)
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::devtools, any::testthat, any::withr, any::assertthat, any::purrr
          install-pandoc: false
          install-quarto: false
      - name: Exercise both writers with the minimum Arrow version
        shell: Rscript {0}
        run: |
          lib <- tempfile("arrow9-library-")
          dir.create(lib)
          install.packages(
            "https://packagemanager.posit.co/cran/2022-09-01/bin/windows/contrib/4.2/arrow_9.0.0.zip",
            repos = NULL, type = "win.binary", lib = lib
          )
          .libPaths(c(lib, .libPaths()))
          stopifnot(packageVersion("arrow") == "9.0.0")
          stopifnot(requireNamespace("arrow", quietly = TRUE))
          devtools::test(
            filter = "^fabric_(arrow_staging|pbi_dax_query|warehouse_tables)$",
            stop_on_failure = TRUE
          )

  windows-restrictive-locale:
    runs-on: windows-latest
    name: windows-latest (C locale parsing)

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Parse package sources under the C locale
        shell: Rscript {0}
        run: |
          locale <- Sys.setlocale("LC_CTYPE", "C")
          stopifnot(identical(locale, "C"))
          files <- c(
            list.files("R", pattern = "[.][Rr]$", recursive = TRUE, full.names = TRUE),
            list.files("tests", pattern = "[.][Rr]$", recursive = TRUE, full.names = TRUE)
          )
          for (file in files) {
            parse(file = file, encoding = "UTF-8")
          }

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            r: 'release'
            cran: 'https://packagemanager.posit.co/cran/latest'
          - {os: windows-latest, r: 'release'}
          # Match win-builder's Windows Server version for file-lock checks.
          - {os: windows-2022, r: 'devel'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # Use PPM for the CRAN fallback too, including source-only packages.
          cran: ${{ matrix.config.cran }}
          # Include macOS: CRAN's zstd binaries are not supported by pak yet.
          # https://github.com/r-lib/pak/issues/915
          use-public-rspm: always

      - name: Install unixODBC for macOS source builds
        if: runner.os == 'macOS'
        run: brew install unixodbc

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools
          # Config/Needs/ci supplies tested releases of archived ADBC packages.
          needs: check, ci

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Test with randomized expression order
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        env:
          TESTTHAT_UPDATE_SNAPSHOTS: "false"
        run: >-
          Rscript -e
          'options(testthat.snapshot.update = FALSE);
          devtools::test(shuffle = TRUE, stop_on_failure = TRUE)'

      - name: Test the CRAN subset without adbi
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        env:
          NOT_CRAN: "false"
        shell: Rscript {0}
        run: |
          # Isolate the test library without changing the full-suite dependencies.
          lib <- tempfile("cran-test-library-")
          dir.create(lib)
          packages <- installed.packages()
          packages <- packages[
            !duplicated(packages[, "Package"]) & packages[, "Package"] != "adbi",
            , drop = FALSE
          ]
          stopifnot(all(file.symlink(
            file.path(packages[, "LibPath"], packages[, "Package"]),
            file.path(lib, packages[, "Package"])
          )))
          .libPaths(c(lib, .Library), include.site = FALSE)
          stopifnot(!requireNamespace("adbi", quietly = TRUE))
          stopifnot(!rlang::is_installed("adbi"))
          pkgload::load_all(quiet = TRUE)
          withr::with_dir("tests", source("testthat.R"))
          stopifnot(!"adbi" %in% loadedNamespaces())

      - name: Set up uv for delta-rs runtime tests
        if: matrix.config.r == 'release'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/fabric-sandbox/uv.lock

      - name: Install locked delta-rs runtime environment
        if: matrix.config.r == 'release'
        run: uv --directory tools/fabric-sandbox sync --locked

      - name: Select the locked delta-rs Python environment on Unix
        if: matrix.config.r == 'release' && matrix.config.os != 'windows-latest'
        shell: bash
        run: echo "RETICULATE_PYTHON=$GITHUB_WORKSPACE/tools/fabric-sandbox/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Select the locked delta-rs Python environment on Windows
        if: matrix.config.r == 'release' && matrix.config.os == 'windows-latest'
        shell: pwsh
        run: echo "RETICULATE_PYTHON=$env:GITHUB_WORKSPACE/tools/fabric-sandbox/.venv/Scripts/python.exe" >> $env:GITHUB_ENV

      - name: Test the production delta-rs Arrow bridge
        if: matrix.config.r == 'release'
        env:
          FABRIC_DELTA_RS_ORACLE_TESTS: "true"
        run: >-
          Rscript -e
          'devtools::test(filter = "delta-rs-oracle",
          stop_on_failure = TRUE)'

  R-4-1-compatibility:
    runs-on: ubuntu-latest
    name: ubuntu-latest (R 4.1 compatibility)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          cache: false
          install-pandoc: false
          install-quarto: false

      - name: Install package without suggested dependencies
        run: R CMD INSTALL .

      - name: Verify POSIXlt job parameters on R 4.1
        shell: Rscript {0}
        run: |
          stopifnot(getRversion() >= "4.1", getRversion() < "4.2")

          parameters <- getFromNamespace(
            ".fabric_job_parameters",
            "fabricQueryR"
          )
          scalar <- as.POSIXlt(
            "2026-08-07 10:15:30",
            tz = "Europe/Amsterdam"
          )

          stopifnot(
            inherits(scalar, "POSIXlt"),
            length(as.POSIXct(scalar)) == 1L
          )
          result <- parameters(list(started_at = scalar))[[1L]]
          stopifnot(
            identical(result$type, "DateTime"),
            identical(result$value, "2026-08-07T08:15:30Z")
          )

          multiple <- as.POSIXlt(
            c("2026-08-07 10:15:30", "2026-08-07 10:15:31"),
            tz = "UTC"
          )
          error <- tryCatch(
            parameters(list(started_at = multiple)),
            error = identity
          )
          stopifnot(
            inherits(error, "error"),
            grepl(
              "one non-missing scalar",
              conditionMessage(error),
              fixed = TRUE
            )
          )
