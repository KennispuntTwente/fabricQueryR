find_replace:
  - find_value: '\#\s*META\s+"default_lakehouse":\s*"([0-9a-fA-F-]{36})"'
    replace_value:
      _ALL_: "$ENV:FABRIC_TEST_LAKEHOUSE_ID"
    is_regex: "true"
    item_type: "Notebook"
    item_name: "SeedFixtures"
    file_path: "**/notebook-content.py"
  - find_value: '\#\s*META\s+"default_lakehouse_workspace_id":\s*"([0-9a-fA-F-]{36})"'
    replace_value:
      _ALL_: "$workspace.$id"
    is_regex: "true"
    item_type: "Notebook"
    item_name: "SeedFixtures"
    file_path: "**/notebook-content.py"
  - find_value: '(?m)^lakehouse_id\s*=\s*"([0-9a-fA-F-]{36})"'
    replace_value:
      _ALL_: "$ENV:FABRIC_TEST_LAKEHOUSE_ID"
    is_regex: "true"
    item_type: "Notebook"
    item_name: "SeedFixtures"
    file_path: "**/notebook-content.py"
  - find_value: '(?m)^non_schema_lakehouse_id\s*=\s*"([0-9a-fA-F-]{36})"'
    replace_value:
      _ALL_: "$ENV:FABRIC_NON_SCHEMA_LAKEHOUSE_ID"
    is_regex: "true"
    item_type: "Notebook"
    item_name: "SeedFixtures"
    file_path: "**/notebook-content.py"
  - find_value: '(?m)^workspace_id\s*=\s*"([0-9a-fA-F-]{36})"'
    replace_value:
      _ALL_: "$workspace.$id"
    is_regex: "true"
    item_type: "Notebook"
    item_name: "SeedFixtures"
    file_path: "**/notebook-content.py"
  - find_value: '(?m)^runtime_lane\s*=\s*"(core|runtime2|preview)"'
    replace_value:
      _ALL_: "$ENV:FABRIC_SPARK_RUNTIME_LANE"
    is_regex: "true"
    item_type: "Notebook"
    item_name: "SeedFixtures"
    file_path: "**/notebook-content.py"
  - find_value: '(?m)^expected_runtime_version\s*=\s*"(1\.3|2\.0)"'
    replace_value:
      _ALL_: "$ENV:FABRIC_SPARK_RUNTIME_VERSION"
    is_regex: "true"
    item_type: "Notebook"
    item_name: "SeedFixtures"
    file_path: "**/notebook-content.py"
  - find_value: '"defaultLakehouseArtifactId":\s*"([0-9a-fA-F-]{36})"'
    replace_value:
      _ALL_: "$ENV:FABRIC_TEST_LAKEHOUSE_ID"
    is_regex: "true"
    item_type: "SparkJobDefinition"
    item_name: "TestSparkJob"
    file_path: "**/SparkJobDefinitionV1.json"
  - find_value: '(?m)^runtime_version:\s*(1\.3|2\.0)\s*$'
    replace_value:
      _ALL_: "$ENV:FABRIC_SPARK_RUNTIME_VERSION"
    is_regex: "true"
    item_type: "Environment"
    item_name: "TestEnvironment"
    file_path: "**/Sparkcompute.yml"
